name: Build Athar Garmin APK & AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      - name: Prepare Clean Flutter Android Project
        run: |
          mkdir -p /tmp/src_backup
          cp pubspec.yaml /tmp/src_backup/
          cp -r lib /tmp/src_backup/
          cp android/app/src/main/AndroidManifest.xml /tmp/src_backup/
          rm -rf android pubspec.lock
          flutter create --platforms=android --org com.athar.gnss --project-name athar_gnss .
          cp /tmp/src_backup/pubspec.yaml .
          rm -rf lib && cp -r /tmp/src_backup/lib .
          cp /tmp/src_backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          flutter pub get
      - name: Build APK & Play Store AppBundle
        run: |
          flutter build apk --release
          flutter build appbundle --release
      - name: Upload Play Store & APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Athar-Garmin-PlayStore-Files
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
            
